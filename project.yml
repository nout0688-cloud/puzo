name: Puzo
options:
  bundleIdPrefix: com.puzo
  deploymentTarget:
    iOS: "17.0"
targets:
  Puzo:
    type: application
    platform: iOS
    sources: [Puzo]
    info:
      path: Puzo/Info.plist
      properties:
        CFBundleDisplayName: Puzo
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puzo.player
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
